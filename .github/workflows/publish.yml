name: Publish to PyPI

# Pushing a tag vX.Y.Z publishes kaleido-cli X.Y.Z via PyPI trusted publishing (OIDC).
# Requires a trusted publisher on PyPI for this repo, workflow `publish.yml`, environment `pypi`.

on:
  push:
    tags: ["v*"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7.5.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check tag matches package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          INIT="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' kaleido_cli/__init__.py)"
          [ "$TAG" = "$PYPROJECT" ] || { echo "tag $TAG != pyproject $PYPROJECT" >&2; exit 1; }
          [ "$TAG" = "$INIT" ] || { echo "tag $TAG != __version__ $INIT" >&2; exit 1; }
      - name: Lint
        run: |
          uvx ruff format --check .
          uvx ruff check .
      - name: Test
        run: uv run --frozen pytest -q
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/kaleido-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
